<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">MCSM Live Presence</title>
  <desc id="desc">An original open-book symbol beside the project title on a dark background. Community-built Discord presence for Linux and Proton.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#0a101b"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#b5f4cc"/><stop offset="1" stop-color="#59ca94"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bdcde3" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <path d="M0 338H1200" stroke="#65d69b" stroke-opacity=".5" stroke-width="4"/>
  <g transform="translate(80 80)">
    <rect width="180" height="180" rx="34" fill="#142d2b" stroke="#4c9b7d" stroke-opacity=".5"/>
    <path d="M35 53L90 69 145 53V128L90 145 35 128Z" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M90 70V142M48 74L76 82M48 94L76 102M104 82L132 74M104 102L132 94" fill="none" stroke="#a9efc6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="146" cy="35" r="12" fill="#84e4ab" stroke="#142d2b" stroke-width="6"/>
  </g>
  <text x="302" y="118" fill="#94a9bc" font-family="system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="3">COMMUNITY PROJECT · LINUX / PROTON</text>
  <text x="298" y="184" fill="#eef5fc" font-family="system-ui, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.5">MCSM Live Presence</text>
  <text x="302" y="228" fill="#abbdd0" font-family="system-ui, sans-serif" font-size="23">Your adventure, live on Discord.</text>
  <circle cx="310" cy="270" r="5" fill="#84e4ab"/>
  <text x="326" y="276" fill="#a9d9bc" font-family="system-ui, sans-serif" font-size="15">Live scenes. Pause detection. Episode browsing.</text>
